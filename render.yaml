services:
  - type: web
    name: grace-book-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://sedecampestre.oceanodagraca.com
      # Database - Configure no dashboard do Render
      - key: MONGODB_URI
        sync: false
      # JWT - Configure no dashboard do Render
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
      # ASAAS Payment Gateway - Configure no dashboard do Render
      # (o código lê ASAAS_API_URL, não ASAAS_BASE_URL — o nome antigo aqui
      # nunca era lido pelo app, então a URL da API ficava undefined)
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_API_URL
        value: https://api.asaas.com/v3
      - key: ASAAS_WEBHOOK_SECRET
        sync: false
      # Email Configuration - Configure no dashboard do Render
      # (o serviço de email usa a API do Resend — crie a chave em
      # https://resend.com/api-keys. EMAIL_FROM precisa ser um endereço do
      # domínio verificado no Resend, senão o envio é rejeitado)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: no-reply@notifications.oceanodagraca.com
